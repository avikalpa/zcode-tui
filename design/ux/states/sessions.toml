# ux-falsify state manifest — session list (leader l)
[identity]
component = "session-list"
state = "open"
claim = "session list opens and lists sessions like the reference"
contract_rev = 3  # rev3: rects re-measured at TRUE 120x40 winsize (rev2 fix exposed rev0.1 mis-sized renders)

[environment]
geometry = [120, 40]

[reference]
app = "opencode"
cmd = ["opencode"]
cwd = "/tmp/ux-falsify/proj"
readiness = ""
timeout = 20.0
warmup_ms = 3000
stable_ms = 700

[[reference.drive]]
ms = 1200

[[reference.drive]]
send = "ctrl+x"
ms = 120

[[reference.drive]]
send = "l"
ms = 900

[reference.sig_masks]
composer_cycle = { rect = [21, 3, 21, 95] }   # placeholder typewriter row @ true size (measured 2026-10-27 rev3)


[candidate]
app = "zcode-tui"
cmd = ["/tmp/zcode-tui--ux2/bin/zcode-tui"]
cwd = "/tmp/ux-falsify/proj"
readiness = ""
timeout = 45.0
warmup_ms = 3000
stable_ms = 1200

[[candidate.drive]]
ms = 1200

[[candidate.drive]]
send = "ctrl+x"
ms = 120

[[candidate.drive]]
send = "l"
ms = 900

[evaluate.masks.both]
wordmark = { rect = [13, 38, 20, 95], reason = "owner 2026-09-18: zcodetui logo stays (rect rev3, true size)" }

[candidate.sig_masks]
composer_cycle = { rect = [20, 3, 27, 119] }  # typewriter row 22 + cycle-boundary redraw @ true size (measured rev3)
